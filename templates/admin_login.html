{% extends "base.html" %}

{% block title %}Admin Login | Client Portal{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-2">Admin login</h1>
          <p class="text-muted mb-4">Sign in to manage clients, uploads, and records.</p>

          <form method="post" action="{{ url_for('admin.login', next=request.args.get('next')) }}">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="email" required autofocus>
            </div>

            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
